# 本地自测 patch：覆盖 dsh 的搜索 provider 选择，并插入本插件（路径以「dsh 启动目录」
# 为基准，最保险的是用引号包裹的绝对路径）。
#
# 推荐用法（把下面两处路径改成你机器上的绝对值）：
#
#   1. 改下面 `insert` 里 name 的绝对路径（指向本插件入口）；
#   2. cd 到可以运行 dsh 的目录（harness 源码根目录，或任意已安装 dsh 的环境）；
#   3. dsh web --patch "<本文件的绝对路径>"
#
# ⚠️ 第一部分（覆盖 `web` 行）不是可选项：dsh-base 的 bundle patch 已经显式写了
#    `searchProvider: deepseek-official`，只要它还在，本链即使注册成功也**不会被选中** ——
#    表现为「装好了，但搜索还是走官方内置」。
#
# ⚠️ patch 的语义是**替换整行 config**，不是合并，所以 `fetchProvider` 必须重述。
#
# 密钥优先放 .env（参考 .env.example）或 harness 凭据库；不要把真实密钥写进任何 patch。
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: web-search-chain
    fetchProvider: http

- insert:
    - id: web-search-chain
      name: 'CHANGE_ME_插件入口/lib/index.js'
      config:
        strategy: failover
        timeoutMs: 15000
        maxResults: 8
        apiKeys: {}
        engines: {}
        # 请求预算护栏：默认启用，用静态表里按免费额度推导出的每日上限。
        # 想让某个引擎不受限（例如你已确认它在按量付费区间内），把它设为 0。
        quota:
          enabled: true
          dailyLimits: {}
          cooldownMs: 600000
          persist: true
